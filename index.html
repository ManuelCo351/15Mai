<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 - Alma | Temática Lunar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes: Great Vibes (Elegante para títulos) y Montserrat (Limpia para textos) -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        .fuente-titulo { font-family: 'Great Vibes', cursive; }
        .fuente-texto { font-family: 'Montserrat', sans-serif; }
        
        /* Animación suave para desvanecer la pantalla inicial */
        .fade-out { 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.8s ease-in-out; 
        }
        
        /* Clase mágica: Convierte tu archivo SVG externo en un elemento plateado manipulable */
        .svg-plateado {
            background-color: #E2E8F0; /* Slate-200 de Tailwind (Plateado) */
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
        }
                /* Animación para que las estrellas brillen */
        @keyframes titilar {
            0% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px rgba(255,255,255,0.8); }
            100% { opacity: 0.1; transform: scale(0.8); }
        }
        
    </style>
</head>
<body class="bg-blue-950 fuente-texto overflow-hidden" id="body">
    <!-- Contenedor del cielo estrellado (Fondo dinámico) -->
    <div id="cielo-estrellado" class="fixed inset-0 pointer-events-none z-0"></div>
    
    <!-- ==========================================
         1. PANTALLA DE INICIO (El "Sobre" interactivo)
         ========================================== -->
    <div id="pantalla-sobre" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-blue-950 transition-all duration-1000">
        
        <!-- Sello interactivo usando tu SVG Boho Místico -->
        <div id="boton-abrir" class="cursor-pointer flex flex-col items-center transform transition hover:scale-110">
            
            <!-- Llamamos al SVG como imagen y lo volvemos blanco con filtros -->
<img src="./45008982_9123934.svg" 
     alt="Sello lunar" 
     class="w-40 h-40 mb-6 brightness-0 invert drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]">

            
            <p class="text-slate-300 tracking-[0.2em] text-sm animate-pulse">PRESIONÁ PARA ABRIR</p>
        </div>
    </div>

    <!-- ==========================================
         2. CONTENIDO PRINCIPAL (La Invitación)
         ========================================== -->
<!-- Sección Hero (Nombre, música y cuenta regresiva) -->
<section class="min-h-screen flex flex-col items-center justify-center relative px-6 text-center py-20">
    
    <!-- Título -->
    <h1 class="fuente-titulo text-7xl md:text-8xl text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.6)] mb-2">
        Alma
    </h1>
    <p class="text-slate-300 tracking-[0.3em] uppercase text-xs md:text-sm mb-8 font-light">
        Mis Quince Años
    </p>

    <!-- Reproductor de Audio Visual -->
    <div class="flex items-center gap-3 mb-10 bg-white/5 border border-white/10 backdrop-blur-sm px-4 py-2 rounded-full shadow-lg">
        <button id="btn-musica" class="text-slate-200 hover:text-white transition transform hover:scale-110">
            <!-- Ícono de Pausa inicial (porque asume que arranca sola al abrir) -->
            <svg id="icono-musica" xmlns="http://www.w3.org/1998/Math/MathML" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path d="M8 5v14l11-7z" id="path-play" class="hidden"/>
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" id="path-pausa"/>
            </svg>
        </button>
        <span class="text-slate-300 text-xs tracking-widest uppercase">Every Breath You Take</span>
    </div>

    <!-- Texto Introductorio -->
    <p class="text-slate-200 text-sm md:text-base leading-relaxed max-w-md mx-auto mb-12 font-light">
        "Hay días que se vuelven inolvidables, momentos que queremos guardar para siempre y personas que hacen nuestra vida más especial. Por eso quiero que estén conmigo en esta noche tan importante..."
    </p>

    <!-- Acá podés usar la otra Luna Geométrica que me mostraste como separador -->
     <img src="./13728465_22_april_2.svg" class="w-20 h-20 mb-12 brightness-0 invert opacity-50">

    <!-- Título Cuenta Regresiva -->
    <h2 class="fuente-titulo text-4xl text-white mb-6 tracking-wide drop-shadow-md">Faltan</h2>

    <!-- Contenedor Cuenta Regresiva (Efecto Cristal) -->
    <div class="grid grid-cols-4 gap-3 md:gap-6 w-full max-w-lg">
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl py-3 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.1)]">
            <span id="dias" class="text-2xl md:text-4xl text-white font-semibold">00</span>
            <span class="text-[10px] md:text-xs text-slate-300 tracking-widest uppercase mt-1">Días</span>
        </div>
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl py-3 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.1)]">
            <span id="horas" class="text-2xl md:text-4xl text-white font-semibold">00</span>
            <span class="text-[10px] md:text-xs text-slate-300 tracking-widest uppercase mt-1">Hs</span>
        </div>
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl py-3 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.1)]">
            <span id="minutos" class="text-2xl md:text-4xl text-white font-semibold">00</span>
            <span class="text-[10px] md:text-xs text-slate-300 tracking-widest uppercase mt-1">Min</span>
        </div>
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl py-3 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.1)]">
            <span id="segundos" class="text-2xl md:text-4xl text-white font-semibold">00</span>
            <span class="text-[10px] md:text-xs text-slate-300 tracking-widest uppercase mt-1">Seg</span>
        </div>
    </div>
</section>
    

    <!-- ==========================================
         3. LÓGICA JAVASCRIPT
         ========================================== -->
    <script>
        const pantallaSobre = document.getElementById('pantalla-sobre');
        const botonAbrir = document.getElementById('boton-abrir');
        const contenidoPrincipal = document.getElementById('contenido-principal');
        const body = document.getElementById('body');
        const musicaFondo = document.getElementById('musica-fondo');

        botonAbrir.addEventListener('click', () => {
            // 1. Desvanecemos la pantalla inicial
            pantallaSobre.classList.add('fade-out');
            
            // 2. Esperamos que termine el efecto, ocultamos el div y mostramos la invitación
            setTimeout(() => {
                pantallaSobre.style.display = 'none';
                contenidoPrincipal.classList.remove('hidden');
                
                // Permitimos hacer scroll en la página
                body.classList.remove('overflow-hidden');
                
                // Hacemos que la invitación aparezca suavemente
                setTimeout(() => contenidoPrincipal.classList.remove('opacity-0'), 50);
            }, 800);

            // 3. Reproducimos la música (Descomentalo cuando pongas el archivo de audio)
            // musicaFondo.play().catch(error => console.log("El navegador bloqueó el autoplay", error));
            // ==========================================
// LÓGICA DE LA MÚSICA
// ==========================================
const btnMusica = document.getElementById('btn-musica');
const pathPlay = document.getElementById('path-play');
const pathPausa = document.getElementById('path-pausa');
let reproduciendo = true; // Asumimos que arranca al abrir el sobre

btnMusica.addEventListener('click', () => {
    if (reproduciendo) {
        // musicaFondo.pause(); // Descomentar cuando tengas el audio
        pathPausa.classList.add('hidden');
        pathPlay.classList.remove('hidden');
    } else {
        // musicaFondo.play(); // Descomentar cuando tengas el audio
        pathPlay.classList.add('hidden');
        pathPausa.classList.remove('hidden');
    }
    reproduciendo = !reproduciendo;
});

// ==========================================
// LÓGICA DE LA CUENTA REGRESIVA
// ==========================================
// Poné acá la fecha de la fiesta (Año, Mes en inglés, Día, Hora)
const fechaFiesta = new Date("December 12, 2026 21:00:00").getTime();

const actualizarReloj = setInterval(function() {
    const ahora = new Date().getTime();
    const distancia = fechaFiesta - ahora;

    // Cálculos matemáticos para días, horas, minutos y segundos
    const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

    // Inyectamos los números en el HTML (con padStart para que siempre tengan 2 dígitos, ej: "09")
    document.getElementById("dias").innerText = String(dias).padStart(2, '0');
    document.getElementById("horas").innerText = String(horas).padStart(2, '0');
    document.getElementById("minutos").innerText = String(minutos).padStart(2, '0');
    document.getElementById("segundos").innerText = String(segundos).padStart(2, '0');

    // Si la fecha ya pasó, detenemos el reloj
    if (distancia < 0) {
        clearInterval(actualizarReloj);
        document.getElementById("dias").innerText = "00";
        document.getElementById("horas").innerText = "00";
        document.getElementById("minutos").innerText = "00";
        document.getElementById("segundos").innerText = "00";
    }
}, 1000); // Se actualiza cada 1 segundo
            
        });
    </script>
</body>
</html>
